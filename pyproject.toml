[project]
name = "nocomments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.0"
dependencies = [
    "urllib3>=2.7.0",
]

[tool.setuptools]
py-modules = ["main"]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "black>=24.8.0",
    "pre-commit-hooks>=5.0.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.1.1",
    "isort>=5.13.2",
    "pip-audit>=2.7.3",
]

[tool.black]
line-length = 79

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.isort]
profile = "black"
line_length = 79
